<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AF Pro</title>
<style>
:root{--bg:#14181d;--p:#1d232b;--p2:#262e38;--tx:#e9e6df;--mu:#8f98a3;--ac:#f2b84b;--er:#ef6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:20px}
#app{max-width:600px;margin:0 auto}
.card{background:var(--p);border:1px solid #2c3541;border-radius:12px;padding:16px;margin-bottom:12px}
input,select,button{width:100%;padding:12px;margin-top:8px;background:var(--p2);color:var(--tx);border:1px solid #38424f;border-radius:8px;font:inherit}
button.pri{background:var(--ac);color:#1a1405;font-weight:700;border:0;cursor:pointer}
button.lk{background:none;border:0;color:var(--mu);padding:6px 0;cursor:pointer;text-align:center;display:block;width:100%}
.mu{color:var(--mu);font-size:13px}
.eh{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div id="app"></div>

<script>
const URL_='https://rvualboqhxyrsxmorphy.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2dWFsYm9xaHh5cnN4bW9ycGh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMDU3NTgsImV4cCI6MjEwNzc4MTc1OH0.N1SS3KXuCAqVVp9GWHz9U-KNr_S0rG8zX4J0zmaAiQs';

let DB = JSON.parse(localStorage.getItem('tdb') || '{"students":[]}');
let AU = JSON.parse(localStorage.getItem('tau') || 'null');
let currentStudent = null;

function render() {
  try {
    const app = document.getElementById('app');
    if (!app) return;

    if (!AU) {
      app.innerHTML = `
        <h1>AF Pro · Acesso</h1>
        <div class="card">
          <input id="em" type="email" placeholder="E-mail" value="andrey.log@hotmail.com">
          <input id="pw" type="password" placeholder="Senha">
          <button class="pri" onclick="doLogin()">Entrar com Supabase</button>
          <button class="lk" onclick="forceLocalLogin()" style="margin-top:12px;color:var(--ac);">Entrar Direto (Modo Local/Offline)</button>
          <p id="msg" class="mu" style="margin-top:8px;color:var(--er);text-align:center;"></p>
        </div>`;
      return;
    }

    if (currentStudent) {
      const st = DB.students.find(s => s.id === currentStudent);
      if(!st) { currentStudent = null; render(); return; }
      app.innerHTML = `
        <div class="eh">
          <button style="width:auto;padding:6px 12px;" onclick="currentStudent=null;render()">← Voltar</button>
          <button style="width:auto;padding:6px 12px;background:#ef6b6b;border:0;color:#fff;" onclick="deleteStudent('${st.id}')">Excluir Aluno</button>
        </div>
        <h2>${st.name}</h2>
        <div class="card">
          <p class="mu">E-mail: ${st.email || 'Não cadastrado'}</p>
          <p class="mu">Tipo: ${st.type || 'Presencial'}</p>
        </div>
        <h3>Treinos</h3>
        ${(st.workouts || []).map(w => `<div class="card"><b>${w.name}</b><p class="mu">${w.plan.length} exercícios</p></div>`).join('') || '<p class="mu">Nenhum treino ainda.</p>'}
        <button class="pri" onclick="addWorkout('${st.id}')">+ Adicionar Treino</button>
      `;
      return;
    }

    app.innerHTML = `
      <div class="eh">
        <h1>Painel AF Pro</h1>
        <button style="width:auto;padding:6px 12px;background:#262e38;border:1px solid #38424f;" onclick="doLogout()">Sair</button>
      </div>
      <div class="card">
        <p class="mu">Usuário: <b>${AU.email}</b></p>
      </div>
      
      <div class="eh" style="margin-top:16px;">
        <h3>Alunos</h3>
        <button class="pri" style="width:auto;margin:0;padding:8px 14px;" onclick="addStudent()">+ Novo Aluno</button>
      </div>
      
      <div style="margin-top:8px;">
        ${DB.students.map(s => `
          <div class="card" style="cursor:pointer;" onclick="currentStudent='${s.id}';render()">
            <b>${s.name}</b>
            <p class="mu">${(s.workouts||[]).length} treino(s) · ${s.type || 'Presencial'}</p>
          </div>
        `).join('') || '<p class="mu">Nenhum aluno cadastrado ainda.</p>'}
      </div>
    `;
  } catch (err) {
    console.error("Erro no render:", err);
  }
}

async function doLogin() {
  const email = document.getElementById('em').value.trim();
  const password = document.getElementById('pw').value;
  const msgEl = document.getElementById('msg');
  msgEl.innerText = 'Entrando...';
  
  try {
    const res = await fetch(URL_ + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok) {
      AU = { email: data.user?.email || email };
      localStorage.setItem('tau', JSON.stringify(AU));
      render();
    } else {
      msgEl.innerText = data.error_description || data.msg || 'Erro ao entrar.';
    }
  } catch (e) {
    msgEl.innerText = 'Erro de rede. Use o "Entrar Direto".';
  }
}

function forceLocalLogin() {
  AU = { email: 'andrey.log@hotmail.com (Local)' };
  localStorage.setItem('tau', JSON.stringify(AU));
  render();
}

function doLogout() {
  AU = null;
  localStorage.removeItem('tau');
  render();
}

function addStudent() {
  const name = prompt('Nome do aluno:');
  if (!name || !name.trim()) return;
  const type = confirm('Este aluno é Online? (OK para Online, Cancelar para Presencial)') ? 'online' : 'presencial';
  
  DB.students.push({
    id: crypto.randomUUID(),
    name: name.trim(),
    type: type,
    email: '',
    workouts: []
  });
  localStorage.setItem('tdb', JSON.stringify(DB));
  render();
}

function deleteStudent(id) {
  if (!confirm('Excluir aluno?')) return;
  DB.students = DB.students.filter(s => s.id !== id);
  localStorage.setItem('tdb', JSON.stringify(DB));
  currentStudent = null;
  render();
}

function addWorkout(studentId) {
  const name = prompt('Nome do treino (ex: Treino A):');
  if (!name || !name.trim()) return;
  const st = DB.students.find(s => s.id === studentId);
  if (!st.workouts) st.workouts = [];
  st.workouts.push({
    id: crypto.randomUUID(),
    name: name.trim(),
    plan: []
  });
  localStorage.setItem('tdb', JSON.stringify(DB));
  render();
}

// Inicializa a tela com segurança total contra tela cinza
render();
</script>
</body>
</html>
