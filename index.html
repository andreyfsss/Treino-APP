<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AF Pro</title>
<style>
:root{--bg:#14181d;--p:#1d232b;--p2:#262e38;--tx:#e9e6df;--mu:#8f98a3;--ac:#f2b84b;--er:#ef6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:20px}
#app{max-width:600px;margin:0 auto}
.card{background:var(--p);border:1px solid #2c3541;border-radius:12px;padding:16px;margin-bottom:12px}
input,button{width:100%;padding:12px;margin-top:8px;background:var(--p2);color:var(--tx);border:1px solid #38424f;border-radius:8px;font:inherit}
button.pri{background:var(--ac);color:#1a1405;font-weight:700;border:0}
.mu{color:var(--mu);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <h1>AF Pro - Carregando...</h1>
</div>

<script>
const URL_='https://rvualboqhxyrsxmorphy.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2dWFsYm9xaHh5cnN4bW9ycGh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyMDU3NTgsImV4cCI6MjEwNzc4MTc1OH0.N1SS3KXuCAqVVp9GWHz9U-KNr_S0rG8zX4J0zmaAiQs';
const MASTER_EMAIL = 'andrey.log@hotmail.com';

let DB = JSON.parse(localStorage.getItem('tdb') || '{"docs":{}}');
let AU = JSON.parse(localStorage.getItem('tau') || 'null');

function render() {
  const app = document.getElementById('app');
  if (!AU) {
    app.innerHTML = `
      <h1>AF Pro · Login</h1>
      <div class="card">
        <input id="em" type="email" placeholder="E-mail" value="andrey.log@hotmail.com">
        <input id="pw" type="password" placeholder="Senha">
        <button class="pri" onclick="doLogin()">Entrar no Sistema</button>
        <p id="msg" class="mu" style="margin-top:8px;color:var(--er);"></p>
      </div>`;
  } else {
    app.innerHTML = `
      <h1>Painel AF Pro (Admin)</h1>
      <div class="card">
        <p>Logado com sucesso como: <b>${AU.email}</b></p>
        <button onclick="doLogout()" style="background:#ef6b6b;color:#fff;border:0;">Sair da Conta</button>
      </div>`;
  }
}

async function doLogin() {
  const email = document.getElementById('em').value.trim();
  const password = document.getElementById('pw').value;
  try {
    const res = await fetch(URL_ + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok) {
      AU = { at: data.access_token, rt: data.refresh_token, email: data.user?.email || email };
      localStorage.setItem('tau', JSON.stringify(AU));
      render();
    } else {
      document.getElementById('msg').innerText = data.error_description || 'Erro ao entrar. Verifique os dados.';
    }
  } catch (e) {
    document.getElementById('msg').innerText = 'Falha de conexão com o Supabase.';
  }
}

function doLogout() {
  AU = null;
  localStorage.removeItem('tau');
  render();
}

render();
</script>
</body>
</html>
