function agg(st,a,b){const A=ds(a),B=ds(b),pl=(st.data.workouts||[]).flatMap(w=>w.plan),nm={},gm={},ws={},ex={},gr={};pl.forEach(e=>{nm[e.id]=e.name||'(sem nome)';gm[e.id]=e.group});(st.data.workouts||[]).forEach(w=>ws[w.id]=w.name);
const ss=sessions(st.id).filter(x=>x.data.date>=A&&x.data.date<=B&&sesN(x)>0).sort((x,y)=>x.data.date<y.data.date?-1:1);let V=0,N=0;
ss.forEach(x=>Object.entries(x.data.sets).forEach(([id,arr])=>{const n=exN(arr);if(!n)return;const v=exVol(arr),r=arr.map(q=>+q.rpe).filter(q=>q>0),g=gm[id]||'Outro',m=nm[id]||'(exercício removido)',e=(ex[m]??={v:0,n:0,r:[],t:0,rp:0}),q=(gr[g]??={v:0,n:0});e.v+=v;e.n+=n;e.r.push(...r);e.t+=arr.reduce((u,q)=>u+(+q.sec||0),0);e.rp+=arr.reduce((u,q)=>u+(+q.reps||0),0);q.v+=v;q.n+=n;V+=v;N+=n}));
return{ss,ex,gr,V,N,ws}}
function repText(st,a,b,w){const o=agg(st,a,b),pa=w?new Date(a.getFullYear(),a.getMonth(),a.getDate()-7):new Date(a.getFullYear(),a.getMonth()-1,1),pb=w?new Date(b.getFullYear(),b.getMonth(),b.getDate()-7):new Date(a.getFullYear(),a.getMonth(),0),p=agg(st,pa,pb);
const L=[`Relatório ${w?'da semana':'do mês'} · ${st.data.name}`,fd(ds(a))+' a '+fd(ds(b)),''];
if(!o.ss.length){L.push('Nenhum treino registrado no período.');return L.join('\n')}
L.push(`Treinos: ${o.ss.length} · Volume: ${fmt(o.V)} kg · Séries: ${o.N}`);
if(p.V)L.push(`Volume vs. período anterior: ${o.V>=p.V?'+':''}${Math.round((o.V/p.V-1)*100)}% (${fmt(p.V)} kg)`);
L.push('','Treinos:',...o.ss.map(x=>`- ${fd(x.data.date)} ${o.ws[x.data.workoutId]||'Treino'}: ${fmt(sesVol(x))} kg, ${sesN(x)} séries`));
L.push('','Por grupo muscular:',...Object.entries(o.gr).sort((x,y)=>y[1].n-x[1].n).map(([g,x])=>`- ${g}: ${x.n} séries, ${fmt(x.v)} kg`));
L.push('','Por exercício:',...Object.entries(o.ex).sort((x,y)=>y[1].v-x[1].v).map(([k,x])=>`- ${k}: ${x.n} séries, ${x.v?fmt(x.v)+' kg':x.t?'tempo total '+mm(x.t):x.rp+' repetições'}${x.r.length?', RPE médio '+(x.r.reduce((m,n)=>m+n,0)/x.r.length).toFixed(1).replace('.',','):''}`));
return L.join('\n')}

function curSes(c){let s=sessions(S.sid).find(d=>d.data.date===today()&&!d.data.done&&d.data.workoutId===S.wid);if(!s&&c){const id=uid();put(id,'session',{studentId:S.sid,workoutId:S.wid,date:today(),sets:{}});s=DB.docs[id]}return s}
function last(id){const s=sessions(S.sid).filter(x=>(x.data.date<today()||x.data.done)&&exN(x.data.sets[id])).sort((a,b)=>a.data.date<b.data.date?1:-1)[0];return s?{d:s.data.date,a:s.data.sets[id]}:{d:'',a:[]}}
function vTreino(){const pl=wpl();if(!pl.length)return '<p class=mu>Nenhum exercício montado neste treino ainda.</p>';const cs=curSes();
return pl.map((e,ix)=>{const cur=(cs&&cs.data.sets[e.id])||[],lp=last(e.id),n=rowsN(e.id,cs),m=e.mode||'load',F=m==='time'?['mn','sg']:m==='bw'?['reps']:['kg','reps'];let rows=HD[m];
for(let i=0;i<n;i++){const c=cur[i]||{},p=lp.a[i]||{};rows+=`<div class=sr><button class=nb data-a=tq data-e="${e.id}" data-i=${i}>${i+1}</button><span class=ant>${lp.a[i]?esc(fa(p,m)):'–'}</span>${F.map(k=>`<input inputmode=decimal data-e="${e.id}" data-i=${i} data-k=${k} value="${esc(c[k]??'')}">`).join('')}${m==='bw'?'<span></span>':''}<button class=x data-a=delset data-e="${e.id}" data-i=${i}>✕</button></div>`}
return `<div class=card><div class=eh><b>${esc(e.name||'(sem nome)')}</b></div>${rows}<button data-a=addset data-e="${e.id}">+ série</button></div>`}).join('')+'<button class=pri data-a=finish>Finalizar treino</button>'}
function rowsN(id,cs){const d=cs&&cs.data,a=(d&&d.sets[id])||[],r=d&&d.rows&&d.rows[id];return Math.max(r??Math.max(last(id).a.length,1),a.length)}
const P={chev:'<path d="m9 6 6 6-6 6"/>',back:'<path d="m15 6-6 6 6 6"/>',uplus:'<circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1M19 8v6M16 11h6"/>',bars:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',dl:'<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>',ul:'<path d="M12 15V3m0 0L8 7m4-4 4 4M4 21h16"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',db:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'};

async function login(){
  const em = $('#em').value.trim(), pw = $('#pw').value;
  const r = await fetch(URL_+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})}).catch(()=>null);
  if(r&&r.ok){ setAu(await r.json()); S.msg=''; render(); sync(); }
  else { S.msg='E-mail ou senha incorretos.'; render(); }
}

async function signup(){
  const name = $('#name')?$('#name').value.trim():'', em = $('#em').value.trim(), pw = $('#pw').value;
  if(!em || !pw) return alert('Preencha e-mail e senha!');
  const r = await fetch(URL_+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})}).catch(()=>null);
  if(r&&r.ok){
    const j = await r.json();
    setAu(j);
    put(uid(),'student',{name:name||'Aluno',email:em,type:'online',workouts:[]});
    S.msg=''; render(); sync();
  } else { S.msg='Erro ao criar conta. Tente outra senha.'; render(); }
}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,k=t.dataset.k,i=+t.dataset.i;
if(a==='login')return login();

if(a==='toggleauth'){ S.authMode = S.authMode==='login'?'signup':'login'; render(); return; }

else if(a==='openw'){S.wid=t.dataset.id;S.tab='treino'}

else if(a==='delw'){if(!confirm('Excluir?'))return;const st=stu(),id=S.wid;sessions(S.sid).filter(x=>x.data.workoutId===id).forEach(x=>del(x.id));st.data.workouts=st.data.workouts.filter(w=>w.id!==id);put(st.id,'student',st.data);S.wid=null;S.tab='treinos'}
else if(a==='back'){if(S.wid){S.wid=null;S.tab='treinos'}else S.v='home'}
else if(a==='tab')S.tab=k;
else if(a==='addst'){const n=prompt('Nome do aluno');if(!n)return;put(uid(),'student',{name:n.trim(),type:S.typeTab,workouts:[]})}
else if(a==='addex'){const s=stu();W().plan.push({id:uid().slice(0,8),name:'',group:'',equip:'',mode:'load'});put(s.id,'student',s.data)}
else if(a==='rmex'){const s=stu();W().plan.splice(i,1);put(s.id,'student',s.data)}
else if(a==='addset'){const cs=curSes(true),id=t.dataset.e,n=rowsN(id,cs);(cs.data.rows??={})[id]=n+1;put(cs.id,'session',cs.data)}
else if(a==='delset'){const cs=curSes(true),id=t.dataset.e,arr=(cs.data.sets[id]??=[]),n=rowsN(id,cs);if(n<=1)arr.splice(0);else arr.splice(i,1);put(cs.id,'session',cs.data)}
else if(a==='delst'){if(!confirm('Excluir?'))return;sessions(S.sid).forEach(s=>del(s.id));del(S.sid);S.v='home'}
else if(a==='finish'){const cs=curSes();if(!cs)return;cs.data.done=true;put(cs.id,'session',cs.data);S.rid=cs.id;S.tab='fim'}
else if(a==='docopy'){

    put(st.id,'student',st.data);
    alert('Fichas e exercícios copiados com sucesso!');

}
else if(a==='export'){const o=Object.fromEntries(Object.entries(DB.docs).filter(([,d])=>!d.deleted)),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='backup.json';a.click()}
else if(a==='logout'){AU=null;localStorage.removeItem('tau');render()}
render();
});
