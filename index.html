return h+`<div class=card><b>Relatório ${S.per==='w'?'da semana':'do mês'} · ${esc(lbl)}</b><p class=mu>${ss.length} treino(s) · ${fmt(V)} kg · ${N} séries · ${S.per==='w'?'por dia':'em blocos de 7 dias'}</p></div><div class=card><b>Volume (kg)</b>${lineC(o.L,[{n:'Volume',c:COL[0],v:o.V}])}</div><div class=card><b>Séries</b>${lineC(o.L,[{n:'Séries',c:COL[2],v:o.N}])}</div><div class=card><b>Séries por grupo</b><div class=chips>${GD.map(x=>`<button class="chip2${sel&&sel.n===x.n?' on':''}" data-a=gsel data-k="${esc(x.n)}"><i style="background:${x.c}"></i>${esc(x.n)}</button>`).join('')}</div>${sel?lineC(o.L,[sel]):'<p class=mu>Toque em um grupo para ver o gráfico dele.</p>'}${tbl(o.L,GD)}</div>`}
if(S.sub==='grp')return h+`<div class=card><b>Séries por grupo</b>${donut(ent(gr,'n'),n=>n+' séries')}</div><div class=card><b>Volume por grupo</b>${hbars(ent(gr,'v'),n=>fmt(n)+' kg','#6aa6ff')}</div>`;
const tot=S.sub==='ser'?N+' séries':fmt(V)+' kg',per=cols(ss.map(s=>[fd(s.data.date),S.sub==='ser'?sesN(s):sesVol(s)]));
return h+`<div class=card><span class=mu>Total · ${ss.length} treino(s)</span><br><b class=big>${tot}</b></div><div class=card><b>Por treino</b>${per}</div><div class=card><b>Por exercício</b>${hbars(ent(ex,u).filter(x=>S.sub==='ser'||x[1]>0),S.sub==='ser'?n=>n+' séries':n=>fmt(n)+' kg',S.sub==='ser'?'#6fcf97':'#f2b84b')}</div>`}
function render(){const app=$('#app');app.innerHTML=!AU?loginV():S.v==='wk'?wkV():S.v==='home'||!stu()?home():sv();stat();if($('#xc'))xsel(XP.length-1)}
function refresh(){const cs=curSes();document.querySelectorAll('[data-v]').forEach(n=>{n.textContent=n.dataset.v==='tot'?fmt(cs?sesVol(cs):0)+' kg':exTot(cs&&cs.data.sets[n.dataset.v],n.dataset.m)});stat()}

/* ---- ações ---- */
async function login(){const r=await fetch(URL_+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})}).catch(()=>null);
if(r&&r.ok){setAu(await r.json());S.msg='';render();sync()}else{S.msg=r?'E-mail ou senha incorretos.':'Sem conexão. Conecte-se para entrar.';render()}}
function exp(){const o=Object.fromEntries(Object.entries(DB.docs).filter(([,d])=>!d.deleted)),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='backup-treino-'+today()+'.json';a.click()}
async function imp(f){if(!f)return;try{Object.values(JSON.parse(await f.text())).forEach(d=>{DB.docs[d.id]={...d,dirty:1}});persist();render();syncSoon()}catch{alert('Arquivo inválido')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,k=t.dataset.k,i=+t.dataset.i;
if(a==='login')return login();
if(a==='open'){S.v='st';S.sid=t.dataset.id;S.tab='treinos';S.wid=null}
else if(a==='openw'){S.wid=t.dataset.id;S.tab='treino'}
else if(a==='addw'){const n=prompt('Nome do treino (ex.: Treino A, Peito e tríceps)');if(!n||!n.trim())return;const st=stu(),id=uid().slice(0,8);st.data.workouts.push({id,name:n.trim(),plan:[]});put(st.id,'student',st.data);S.wid=id;S.tab='ficha'}
else if(a==='rens'){const st=stu(),n=prompt('Nome do aluno',st.data.name);if(!n||!n.trim())return;st.data.name=n.trim();put(st.id,'student',st.data)}
else if(a==='renw'){const n=prompt('Nome do treino',W().name);if(!n||!n.trim())return;const st=stu();W().name=n.trim();put(st.id,'student',st.data)}
else if(a==='delw'){if(!confirm('Excluir este treino e o histórico dele?'))return;const st=stu(),id=S.wid;sessions(S.sid).filter(x=>x.data.workoutId===id).forEach(x=>del(x.id));st.data.workouts=st.data.workouts.filter(w=>w.id!==id);put(st.id,'student',st.data);S.wid=null;S.tab='treinos'}
else if(a==='back'){if(S.wid){S.wid=null;S.tab='treinos'}else S.v='home'}
else if(a==='tab')S.tab=k;
else if(a==='sub')S.sub=k;
else if(a==='per'){S.per=k;S.off=0}
else if(a==='nav')S.off+=+k;
else if(a==='addst'){const n=prompt('Nome do aluno');if(!n||!n.trim())return;put(uid(),'student',{name:n.trim(),workouts:[]})}
else if(a==='addex'){const s=stu();W().plan.push({id:uid().slice(0,8),name:'',group:'',equip:'',mode:'load'});put(s.id,'student',s.data)}
else if(a==='rmex'){const s=stu();W().plan.splice(i,1);put(s.id,'student',s.data)}
else if(a==='addset'){const cs=curSes(true),id=t.dataset.e,n=rowsN(id,cs);(cs.data.rows??={})[id]=n+1;put(cs.id,'session',cs.data)}
else if(a==='delset'){const cs=curSes(true),id=t.dataset.e,arr=(cs.data.sets[id]??=[]),n=rowsN(id,cs),x=arr[i];if(x&&(x.kg||x.reps||x.sec||x.rpe)&&!confirm('Excluir esta série?'))return;if(n<=1)arr.splice(0);else{if(i<arr.length)arr.splice(i,1);(cs.data.rows??={})[id]=n-1}put(cs.id,'session',cs.data)}
else if(a==='delst'){if(!confirm('Excluir este aluno e todo o histórico dele?'))return;sessions(S.sid).forEach(s=>del(s.id));del(S.sid);S.v='home'}
else if(a==='finish'){const cs=curSes();if(!cs){alert('Nada foi registrado hoje neste treino. O treino anterior já está aparecendo.');return}if(!sesN(cs)){if(!confirm('Nenhuma série com repetições foi registrada. Descartar o treino de hoje e voltar ao anterior?'))return;del(cs.id);S.nt=null;render();return}if(!confirm('Finalizar o treino e gerar o relatório?'))return;cs.data.done=true;cs.data.endedAt=new Date().toISOString();put(cs.id,'session',cs.data);S.rid=cs.id;S.tab='fim'}
else if(a==='note')S.nt=t.dataset.e;
else if(a==='notedone')S.nt=null;
else if(a==='delses'){const x=DB.docs[t.dataset.id];if(!confirm('Excluir o treino de '+fd(x.data.date)+' ('+fmt(sesVol(x))+' kg)?'))return;del(x.id)}
else if(a==='wk')S.v='wk';
else if(a==='shst'){const[x1,x2]=wr();return share(repText(DB.docs[t.dataset.id],x1,x2,true))}
else if(a==='shrep'){const[x1,x2]=range();return share(repText(stu(),x1,x2,S.per==='w'))}
else if(a==='exh'){S.ex=t.dataset.id;S.from=S.tab;S.tab='exh';S.exm=null}
else if(a==='exm')S.exm=k;
else if(a==='gsel')S.gsel=S.gsel===k?null:k;
else if(a==='sync')return sync();
else if(a==='export')return exp();
else if(a==='logout'){if(!confirm('Sair? O que não foi sincronizado continua no aparelho.'))return;AU=null;localStorage.removeItem('tau')}
render();if(S.nt){const x=$('textarea');if(x){x.style.height='auto';x.style.height=x.scrollHeight+'px';x.focus()}}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k||!t.dataset.e)return;const cs=curSes(true),arr=(cs.data.sets[t.dataset.e]??=[]),i=+t.dataset.i;while(arr.length<=i)arr.push({});arr[i][k]=t.value.replace(',','.');if(k==='mn'||k==='sg')arr[i].sec=(+arr[i].mn||0)*60+(+arr[i].sg||0);put(cs.id,'session',cs.data);refresh()});
document.addEventListener('input',e=>{const t=e.target,id=t.dataset.n;if(!id)return;const cs=curSes(true);(cs.data.notes??={})[id]=t.value;put(cs.id,'session',cs.data);t.style.height='auto';t.style.height=t.scrollHeight+'px'});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='imp')return imp(t.files[0]);const sd=t.dataset.sd;if(sd){if(!t.value)return;const x=DB.docs[sd];x.data.date=t.value;put(sd,'session',x.data);render();return}const p=t.dataset.p;if(!p)return;const s=stu();W().plan[+t.dataset.i][p]=p==='sets'?(+t.value||0):t.value;put(s.id,'student',s.data)});
addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
migAll();render();sync();
