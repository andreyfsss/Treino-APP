const gr=[0,.5,1].map(f=>`<line x1="${l}" x2="${W-r}" y1="${Y(m*f)}" y2="${Y(m*f)}" stroke="#2c3541"/><text x="${l-4}" y="${Y(m*f)+3}" text-anchor="end" font-size="9" fill="#8f98a3">${fk(m*f)}</text>`).join('');
const xl=L.map((x,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#8f98a3">${x}</text>`).join('');
const ln=D.map(x=>`<polyline fill="none" stroke="${x.c}" stroke-width="2.5" stroke-linejoin="round" points="${x.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`+x.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${x.c}"/>${D.length===1?`<text x="${X(i)}" y="${Y(v)-7}" text-anchor="middle" font-size="10" fill="${x.c}">${fk(v)}</text>`:''}`).join('')).join('');
const lg=D.length>1?'<div style="display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px">'+D.map(x=>`<span class=mu><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${x.c};margin-right:5px"></i>${esc(x.n)}</span>`).join('')+'</div>':'';
return `<svg viewBox="0 0 ${W} ${H}" width="100%">${gr}${xl}${ln}</svg>`+lg}

ex.sort((x,y)=>y[1]-x[1]);const pv=sessions(S.sid).filter(x=>x.data.date<s.data.date).sort((x,y)=>x.data.date<y.data.date?1:-1)[0],pvV=pv?sesVol(pv):0,dl=pvV?` · ${V>=pvV?'+':''}${Math.round((V/pvV-1)*100)}% vs. treino anterior`:'';

if(S.sub==='grp')return h+`<div class=card><b>Séries por grupo</b>${donut(ent(gr,'n'),n=>n+' séries')}</div><div class=card><b>Volume por grupo</b>${hbars(ent(gr,'v'),n=>fmt(n)+' kg','#6aa6ff')}</div>`;
const tot=S.sub==='ser'?N+' séries':fmt(V)+' kg',per=cols(ss.map(s=>[fd(s.data.date),S.sub==='ser'?sesN(s):sesVol(s)]));
return h+`<div class=card><span class=mu>Total · ${ss.length} treino(s)</span><br><b class=big>${tot}</b></div><div class=card><b>Por treino</b>${per}</div><div class=card><b>Por exercício</b>${hbars(ent(ex,u).filter(x=>S.sub==='ser'||x[1]>0),S.sub==='ser'?n=>n+' séries':n=>fmt(n)+' kg',S.sub==='ser'?'#6fcf97':'#f2b84b')}</div>`}
